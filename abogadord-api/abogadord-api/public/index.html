<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generador de Presentaciones</title>
  <style>
    :root {
      color: #0b0c10;
      background: #0d0d16;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: #e9ecf5;
      background: radial-gradient(circle at 10% 20%, #1c1f3d, #0b0c10 50%),
        radial-gradient(circle at 90% 10%, #243058, transparent 40%),
        radial-gradient(circle at 50% 100%, #14182d, transparent 55%),
        #0b0c10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .card {
      width: min(1080px, 100%);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(10px);
    }

    h1 {
      margin: 0 0 8px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    p.subtitle {
      margin: 0 0 24px;
      color: #c5cbdf;
    }

    form {
      display: grid;
      gap: 16px;
    }

    label {
      display: grid;
      gap: 8px;
      font-weight: 600;
      color: #cfd5ea;
    }

    textarea, input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.06);
      color: #f6f8ff;
      font-size: 14px;
      box-sizing: border-box;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      padding: 14px 18px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #5ddcff, #6c4bff);
      color: #0b0c10;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(93, 220, 255, 0.4);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .panel {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 16px;
      border-radius: 12px;
    }

    .steps {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 12px;
    }

    .step {
      display: grid;
      gap: 4px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
    }

    .step small {
      color: #8ea0c2;
    }

    .status {
      font-weight: 700;
      color: #73f6d1;
    }

    .slides {
      display: grid;
      gap: 10px;
      padding: 0;
      list-style: none;
      margin: 0;
    }

    .slide {
      border-radius: 10px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .slide h4 {
      margin: 0 0 4px;
    }

    .slide p {
      margin: 0;
      color: #cfd5ea;
    }

    .muted {
      color: #8ea0c2;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Gemini 3 + Nano Banana Pro</h1>
    <p class="subtitle">Convierte transcripts en outlines y prompts listos para crear un PPT.</p>

    <form id="generatorForm">
      <div class="grid">
        <label>
          Prompt de sistema
          <textarea name="systemPrompt" required placeholder="Contexto fijo para toda presentación"></textarea>
        </label>
        <label>
          Prompt de usuario (orientación)
          <textarea name="userPrompt" required placeholder="Necesidades específicas de la presentación"></textarea>
        </label>
      </div>

      <label>
        Estilo gráfico
        <input name="stylePrompt" placeholder="Ej. fondo degradado, tipografía futurista" />
      </label>

      <label>
        Transcript de la reunión
        <textarea name="transcript" required placeholder="Pega aquí el contenido de la reunión"></textarea>
      </label>

      <button type="submit">Crear presentación</button>
    </form>

    <section class="grid" style="margin-top: 24px;">
      <div class="panel">
        <h3>Progreso de tareas</h3>
        <ul class="steps" id="steps"></ul>
      </div>
      <div class="panel">
        <h3>Slides generadas</h3>
        <ul class="slides" id="slides"></ul>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById("generatorForm");
    const stepsEl = document.getElementById("steps");
    const slidesEl = document.getElementById("slides");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const formData = new FormData(form);
      const payload = Object.fromEntries(formData.entries());

      stepsEl.innerHTML = "<li class='muted'>Generando...</li>";
      slidesEl.innerHTML = "<li class='muted'>Generando...</li>";

      const response = await fetch("/api/presentation", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });

      if (!response.ok) {
        const { error } = await response.json();
        stepsEl.innerHTML = `<li class="muted">Error: ${error}</li>`;
        slidesEl.innerHTML = "";
        return;
      }

      const data = await response.json();
      renderSteps(data.steps);
      renderSlides(data.outline.slides);
    });

    function renderSteps(steps) {
      stepsEl.innerHTML = steps
        .map(
          (step) => `
          <li class="step">
            <div><strong>${step.id}. ${step.title}</strong></div>
            <small>${step.description}</small>
            <div class="status">${step.status.toUpperCase()} · ${step.slides} diapositivas</div>
          </li>
        `
        )
        .join("");
    }

    function renderSlides(slides) {
      slidesEl.innerHTML = slides
        .map(
          (slide) => `
          <li class="slide">
            <h4>${slide.slideNumber}. ${slide.title}</h4>
            <p>${slide.content}</p>
            <p class="muted">Imagen sugerida: ${slide.visualDescription}</p>
          </li>
        `
        )
        .join("");
    }
  </script>
</body>
</html>
